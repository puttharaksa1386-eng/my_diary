<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Voice Diary 🎧</title>
  <style>
    body { font-family: 'Kanit', sans-serif; background: #faf9f6; padding: 20px; color: #333; display: flex; justify-content: center; }
    .card { background: white; width: 100%; max-width: 380px; padding: 25px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
    .day-title { font-size: 20px; font-weight: bold; color: #e07a5f; margin-bottom: 15px; }
    audio { width: 100%; margin: 15px 0; border-radius: 10px; }
    .note-box { background: #f4f1de; padding: 15px; border-radius: 15px; text-align: left; font-size: 15px; line-height: 1.6; margin: 15px 0; color: #3d405b; }
    .photo-box img { width: 100%; border-radius: 15px; object-fit: cover; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="day-title">Day 1 — 29 สิงหาคม 2026 🎧</div>

    <!-- 🎧 ส่วนเล่นเสียง -->
    <audio controls>
      <source src="day1.mp3" type="audio/mpeg">
      เบราว์เซอร์ไม่รองรับการเล่นเสียง
    </audio>

    <!-- 📝 ข้อความบันทึก -->
    <div class="note-box">
      <p>วันนี้เป็นวันแรกที่ได้เริ่มทำไดอารี่เสียง ยินดีที่ได้เล่าเรื่องราวในวันนี้ให้เธอนะ 🤍</p>
    </div>

    <!-- 📷 รูปภาพ -->
    <div class="photo-box">
      <img src="day1.jpg" alt="Day 1 Photo" onerror="this.style.display='none'">
    </div>
  </div>

</body>
</html>
